<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — PierceGate</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-50 font-sans antialiased">

<div class="min-h-full flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 bg-indigo-500 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-slate-900">PierceGate</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to your dashboard</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-100 p-8">

      {% if error %}
      <div class="flex items-center gap-2 bg-red-50 text-red-700 text-sm rounded-xl px-4 py-3 mb-5 ring-1 ring-red-100">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">

        <div>
          <label for="username" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            Username
          </label>
          <input
            id="username"
            name="username"
            type="text"
            required
            autofocus
            class="w-full px-4 py-2.5 rounded-xl text-sm border-0 ring-1 ring-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            placeholder="admin"
          />
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            Password
          </label>
          <input
            id="password"
            name="password"
            type="password"
            required
            class="w-full px-4 py-2.5 rounded-xl text-sm border-0 ring-1 ring-slate-200 bg-slate-50 text-slate-900 placeholder-slate-400
                   focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2.5 px-4 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700
                 transition-colors shadow-sm shadow-indigo-500/20 mt-2">
          Sign in
        </button>

      </form>
    </div>

  </div>
</div>

</body>
</html>

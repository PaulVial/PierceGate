<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PierceGate{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="h-full bg-slate-50 font-sans antialiased">

<div class="flex h-full">

  <!-- ─── Sidebar ─────────────────────────────────────────────────── -->
  <aside class="w-60 bg-slate-900 flex flex-col fixed inset-y-0 left-0 z-40">

    <!-- Logo -->
    <div class="px-5 py-5 border-b border-slate-800">
      <a href="/" class="flex items-center gap-3">
        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center shrink-0 shadow-lg shadow-indigo-500/30">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="text-white font-bold text-base tracking-tight">PierceGate</span>
      </a>
    </div>

    <!-- MENU -->
    <div class="px-5 pt-6 pb-2">
      <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest">Menu</p>
    </div>
    <nav class="px-3 space-y-0.5">

      <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all
        {% if active_page == 'overview' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/20
        {% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="3" width="7" height="7" rx="1" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="3" y="14" width="7" height="7" rx="1" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="14" y="14" width="7" height="7" rx="1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Dashboard
        {% if active_page == 'overview' %}<span class="ml-auto w-1.5 h-1.5 rounded-full bg-indigo-300"></span>{% endif %}
      </a>

      <a href="/logs" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all
        {% if active_page == 'logs' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/20
        {% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
        </svg>
        Logs
        {% if active_page == 'logs' %}<span class="ml-auto w-1.5 h-1.5 rounded-full bg-indigo-300"></span>{% endif %}
      </a>

      <a href="/teams" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all
        {% if active_page == 'admin' or active_page == 'teams' %}bg-indigo-600 text-white shadow-md shadow-indigo-500/20
        {% else %}text-slate-400 hover:text-white hover:bg-slate-800{% endif %}">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Teams
        {% if active_page == 'admin' or active_page == 'teams' %}<span class="ml-auto w-1.5 h-1.5 rounded-full bg-indigo-300"></span>{% endif %}
      </a>

    </nav>

    <!-- GENERAL -->
    <div class="px-5 pt-7 pb-2">
      <p class="text-[10px] font-semibold text-slate-500 uppercase tracking-widest">General</p>
    </div>
    <nav class="px-3 space-y-0.5">
      <span class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 opacity-40 cursor-not-allowed select-none">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        Settings
        <span class="ml-auto text-[10px] font-medium bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded-md">soon</span>
      </span>
      <a href="https://github.com/PaulVial/PierceGate/issues" target="_blank"
         class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Help
      </a>
    </nav>

    <!-- Spacer -->
    <div class="flex-1"></div>

    <!-- User info -->
    <div class="p-4 mx-3 mb-3 rounded-xl bg-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center shrink-0">
          <span class="text-white text-xs font-bold">A</span>
        </div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-white leading-none">Admin</p>
          <p class="text-xs text-slate-400 mt-0.5 truncate">{{ current_month }}</p>
        </div>
      </div>
    </div>

  </aside>
  <!-- ─────────────────────────────────────────────────────────────── -->

  <!-- Main content -->
  <div class="ml-60 flex-1 min-h-full">
    <main class="max-w-6xl mx-auto px-6 py-8">
      {% block content %}{% endblock %}
    </main>
  </div>

</div>
</body>
</html>
